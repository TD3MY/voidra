<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidra</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }

        #tap-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-size: 1.2rem;
            color: #00ffff;
            text-align: center;
            letter-spacing: 2px;
            animation: pulseText 2s infinite;
        }

        .face-container {
            width: 250px;
            height: 200px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 0 50px rgba(0,255,255,0.1);
            transition: all 0.3s ease;
        }

        .eye {
            width: 50px;
            height: 60px;
            background-color: #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 20px #00ffff;
            transition: all 0.1s ease;
        }

        .state-listening .eye {
            height: 70px;
            box-shadow: 0 0 30px #00ffff, 0 0 50px #00ffff;
        }

        .state-thinking .eye {
            height: 15px;
            margin-top: 20px;
            box-shadow: 0 0 10px #ff00ff;
            background-color: #ff00ff;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="tap-screen">Touch the screen to wake me up</div>
    <div id="debug-log" style="position: absolute; bottom: 20px; left: 10px; right: 10px; color: #ff5555; font-size: 14px; z-index: 999; text-align: center;"></div>
    <div id="debug-log" style="position: absolute; bottom: 20px; left: 10px; right: 10px; color: #ff5555; font-size: 14px; z-index: 999; text-align: center;"></div>

    <div class="face-container" id="face">
        <div class="eye" id="eye-left"></div>
        <div class="eye" id="eye-right"></div>
    </div>

    <script>
        function logToScreen(msg) {
            document.getElementById("debug-log").innerText = msg;
        }
        const face = document.getElementById('face');
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let silenceTimer;
        let audioContext;
        let analyser;
        let dataArray;
        
        // ⚠️ اینجا آدرس رندر خودت رو بذار
        const SERVER_URL = "https://mybot2-7gxn.onrender.com/api/chat";

        document.getElementById('tap-screen').addEventListener('click', async () => {
            logToScreen('Step 1: Tapped...');
            document.getElementById('tap-screen').style.display = 'none';
            
            try {
                logToScreen('Step 2: Asking mic...');
                logToScreen('Step 2: Asking mic...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    document.body.classList.add('state-thinking');
                    document.body.classList.remove('state-listening');
                    
                    alert("Recording finished. Sending to server...");
                    logToScreen('Step 3: Sending to server...');
                    logToScreen('Step 3: Sending to server...');
                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'voice.webm');
                    
                    try {
                        const response = await fetch(SERVER_URL, {
                            method: 'POST',
                            body: formData
                        });
                        const result = await response.json();
                        
                        alert("Response received from server!");
                        if(result.error) {
                            alert("Error from server: " + result.error);
                        } else {
                            alert("You: " + result.user_text + "\n\nVoidra: " + result.bot_reply);
                        }
                        
                    } catch (err) {
                        console.error("Error sending audio:", err);
                        alert("خطای شبکه یا سرور: " + err.message);
                    }
                    
                    document.body.classList.remove('state-thinking');
                    document.body.classList.add('state-listening');
                    startListening();
                };

                function startListening() {
                    if (isRecording) return;
                    audioChunks = [];
                    mediaRecorder.start();
                    isRecording = true;
                    document.body.classList.add('state-listening');
                    detectSilence();
                }

                function stopListening() {
                    if (!isRecording) return;
                    mediaRecorder.stop();
                    isRecording = false;
                    clearTimeout(silenceTimer);
                }

                function detectSilence() {
                    if (!isRecording) return;
                    
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;

                    if (average > 20) {
                        const scaleY = 1 + (average / 60);
                        eyeLeft.style.transform = `scale(1, ${scaleY})`;
                        eyeRight.style.transform = `scale(1, ${scaleY})`;
                        
                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(stopListening, 1500);
                    } else {
                        eyeLeft.style.transform = `scale(1)`;
                        eyeRight.style.transform = `scale(1)`;
                    }

                    requestAnimationFrame(detectSilence);
                }
                
                startListening();

            } catch (err) {
                console.error("Microphone access denied:", err);
                alert("برای استفاده از این قابلیت، باید به میکروفون دسترسی بدی!");
            }
        });
    </script>

</body>
</html>
