<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidra</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }

        #tap-screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-size: 1.2rem;
            color: #00ffff;
            text-align: center;
            letter-spacing: 2px;
            animation: pulseText 2s infinite;
            background: #0a0a0a;
        }

        .face-container {
            width: 250px;
            height: 200px;
            background-color: #000;
            border-radius: 40px;
            border: 8px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            box-shadow: 0 0 50px rgba(0,255,255,0.1);
            transition: all 0.3s ease;
        }

        .eye {
            width: 50px;
            height: 60px;
            background-color: #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 20px #00ffff;
            transition: all 0.1s ease;
        }

        .state-listening .eye {
            height: 70px;
            box-shadow: 0 0 30px #00ffff, 0 0 50px #00ffff;
        }

        .state-thinking .eye {
            height: 15px;
            margin-top: 20px;
            box-shadow: 0 0 10px #ff00ff;
            background-color: #ff00ff;
        }

        #status {
            margin-top: 24px;
            color: #00ffff;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            padding: 0 16px;
        }

        #status.error { color: #ff5555; }

        #chat {
            margin-top: 12px;
            width: min(92vw, 520px);
            max-height: 30vh;
            overflow-y: auto;
            color: #ddd;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            padding: 0 8px;
            unicode-bidi: plaintext;
        }

        #chat .you { color: #7f8c8d; margin-bottom: 6px; }
        #chat .bot { color: #e8ffff; }

        #mute-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            background: #111;
            color: #00ffff;
            border: 1px solid #222;
            border-radius: 12px;
            font-size: 20px;
            padding: 6px 10px;
            cursor: pointer;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="tap-screen">Touch the screen to wake me up</div>
    <button id="mute-btn" title="Toggle voice reply">🔊</button>

    <div class="face-container" id="face">
        <div class="eye" id="eye-left"></div>
        <div class="eye" id="eye-right"></div>
    </div>

    <div id="status"></div>
    <div id="chat"></div>

    <script>
        const SERVER_URL = "/api/chat";
        const HEALTH_URL = "https://mybot2-7gxn.onrender.com/";

        const SPEECH_LEVEL = 20;        // volume level that counts as speech
        const SILENCE_MS = 1500;        // silence length that ends a recording
        const MIN_BLOB_BYTES = 3000;    // ignore recordings smaller than this
        const REQUEST_TIMEOUT_MS = 90000; // Render free tier can take ~50s to wake up
        const ERROR_PAUSE_MS = 4000;    // wait before listening again after an error

        const body = document.body;
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');
        const muteBtn = document.getElementById('mute-btn');

        let mediaRecorder, audioContext, analyser, dataArray, stream;
        let audioChunks = [];
        let isRecording = false;
        let hadSpeech = false;
        let silenceTimer = null;
        let recMime = '';
        let muted = false;

        function setStatus(msg, isError) {
            statusEl.textContent = msg || '';
            statusEl.className = isError ? 'error' : '';
        }

        function setState(state) {
            body.classList.remove('state-listening', 'state-thinking');
            if (state) body.classList.add('state-' + state);
        }

        function showChat(userText, botReply) {
            chatEl.innerHTML = '';
            const u = document.createElement('div');
            u.className = 'you';
            u.textContent = userText;
            const b = document.createElement('div');
            b.className = 'bot';
            b.textContent = botReply;
            chatEl.appendChild(u);
            chatEl.appendChild(b);
        }

        muteBtn.addEventListener('click', () => {
            muted = !muted;
            muteBtn.textContent = muted ? '🔇' : '🔊';
            if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
        });

        function pickMime() {
            const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
            for (const m of candidates) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
            }
            return '';
        }

                                function speak(text) {
            return new Promise(resolve => {
                if (muted || !window.speechSynthesis || !text) return resolve();
                window.speechSynthesis.cancel();

                const u = new SpeechSynthesisUtterance(text);
                const isPersian = /[\u0600-\u06FF]/.test(text);
                
                if (isPersian) {
                    u.lang = 'fa-IR';
                    // تلاش برای پیدا کردن صدای فارسی
                    const voices = window.speechSynthesis.getVoices();
                    const faVoice = voices.find(v => v.lang.includes('fa'));
                    if (faVoice) {
                        u.voice = faVoice;
                    } else {
                        console.warn("No Persian voice found on this device!");
                    }
                } else {
                    u.lang = 'en-US';
                }

                u.onend = resolve;
                u.onerror = resolve;
                window.speechSynthesis.speak(u);
            });
        }

        // Wake the Render server up (free tier sleeps when idle). Errors are ignored.
        function wakeServer() {
            fetch(HEALTH_URL, { mode: 'no-cors' }).catch(() => {});
        }

        function startListening() {
            if (isRecording || !mediaRecorder) return;
            audioChunks = [];
            hadSpeech = false;
            mediaRecorder.start();
            isRecording = true;
            setState('listening');
            setStatus('Listening...');
            detectSilence();
        }

        function stopListening() {
            if (!isRecording) return;
            isRecording = false;
            clearTimeout(silenceTimer);
            mediaRecorder.stop();
        }

        function detectSilence() {
            if (!isRecording) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const average = sum / dataArray.length;

            if (average > SPEECH_LEVEL) {
                hadSpeech = true;
                const scaleY = 1 + (average / 60);
                eyeLeft.style.transform = `scale(1, ${scaleY})`;
                eyeRight.style.transform = `scale(1, ${scaleY})`;
                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(stopListening, SILENCE_MS);
            } else {
                eyeLeft.style.transform = 'scale(1)';
                eyeRight.style.transform = 'scale(1)';
            }

            requestAnimationFrame(detectSilence);
        }

        async function sendAudio(blob) {
            const ext = recMime.includes('mp4') ? 'mp4' : recMime.includes('ogg') ? 'ogg' : 'webm';
            const formData = new FormData();
            formData.append('audio', blob, 'voice.' + ext);

            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    body: formData,
                    signal: ctrl.signal
                });
                clearTimeout(timer);

                let result = null;
                try { result = await response.json(); } catch (_) {}

                if (!response.ok || !result || result.error) {
                    const reason = (result && result.error) ? result.error : 'HTTP ' + response.status;
                    throw new Error(reason);
                }

                showChat(result.user_text, result.bot_reply);
                setStatus('');
                
                if (result.audio) {
                    // پخش صدای تولید شده توسط سرور
                    const audioSrc = "data:audio/wav;base64," + result.audio;
                    const audio = new Audio(audioSrc);
                    await audio.play();
                } else {
                    // اگر سرور صدا نداد، از مرورگر استفاده کن
                    await speak(result.bot_reply);
                }
                return true;
            } catch (err) {
                clearTimeout(timer);
                console.error('Error sending audio:', err);
                const msg = err.name === 'AbortError'
                    ? 'Server took too long. Try again in a moment.'
                    : 'Error: ' + err.message;
                setStatus(msg, true);
                return false;
            }
        }

        async function handleRecordingStopped() {
            const blob = new Blob(audioChunks, { type: recMime || 'audio/webm' });
            audioChunks = [];

            // Nothing useful was said: just keep listening.
            if (!hadSpeech || blob.size < MIN_BLOB_BYTES) {
                startListening();
                return;
            }

            setState('thinking');
            setStatus('Thinking...');
            const ok = await sendAudio(blob);

            if (!ok) await new Promise(r => setTimeout(r, ERROR_PAUSE_MS));
            startListening();
        }

        document.getElementById('tap-screen').addEventListener('click', async () => {
            document.getElementById('tap-screen').style.display = 'none';
            wakeServer();

            try {
                setStatus('Asking for microphone...');
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                analyser = audioContext.createAnalyser();
                audioContext.createMediaStreamSource(stream).connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                recMime = pickMime();
                mediaRecorder = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);

                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = handleRecordingStopped;

                startListening();
            } catch (err) {
                console.error('Microphone error:', err);
                document.getElementById('tap-screen').style.display = 'flex';
                setStatus('', false);
                alert('برای استفاده از این قابلیت، باید به میکروفون دسترسی بدی!');
            }
        });
    </script>

</body>
</html>
