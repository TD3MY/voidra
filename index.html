<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidra</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: #00ffff;
        }

        #tap-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            animation: pulseText 2s infinite;
        }

        .eye-container {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,255,0.4) 0%, rgba(0,255,255,0) 70%);
            box-shadow: 0 0 50px rgba(0,255,255,0.5), inset 0 0 20px rgba(0,255,255,0.8);
            transition: all 0.3s ease;
        }

        .eye-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 40px #00ffff;
            transition: all 0.1s ease;
        }

        .state-listening .eye-container {
            box-shadow: 0 0 80px rgba(0,255,255,1), inset 0 0 40px rgba(0,255,255,1);
            transform: scale(1.1);
        }
        .state-listening .eye-core {
            width: 80px;
            height: 80px;
            background: #00ffff;
        }

        .state-thinking .eye-container {
            animation: rotate 2s linear infinite;
            box-shadow: 0 0 80px rgba(255,0,255,1), inset 0 0 40px rgba(255,0,255,1);
        }
        .state-thinking .eye-core {
            background: #ff00ff;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="tap-screen">Touch the screen to wake me up</div>

    <div class="eye-container" id="eye">
        <div class="eye-core"></div>
    </div>

    <script>
        document.getElementById('tap-screen').addEventListener('click', () => {
            document.getElementById('tap-screen').style.display = 'none';
            document.body.classList.add('state-listening');
        });
    </script>

</body>
</html>
